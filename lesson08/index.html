<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tailwind CSS Project</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>

<style>
html {
  scroll-behavior: smooth;
  scroll-padding-top: 5rem;
}
</style>
</head>

<body class="bg-gray-100 text-gray-800 font-[Raleway]">

<header class="bg-cover bg-center" style="background-image: url('header.jpg');">

<div class="fixed inset-x-0 top-0 z-50 bg-black/40">
  <div class="container mx-auto px-4 flex justify-between items-center py-3">

    <div class="font-semibold text-xl md:text-2xl text-yellow-400">
      My Company
    </div>

    <button id="menu-toggle" class="block md:hidden text-yellow-400 text-2xl">
      ☰
    </button>

    <nav class="hidden md:block">
      <ul class="flex gap-4 text-sm md:text-base">
        <li><a href="#" class="inline-block px-4 py-2 rounded bg-white/50 text-black transition duration-200 hover:bg-white/70" aria-current="page">Home</a></li>
        <li><a href="#" class="inline-block px-4 py-2 rounded bg-white/50 text-black transition duration-200 hover:bg-white/70">Clients</a></li>
        <li><a href="#" class="inline-block px-4 py-2 rounded bg-white/50 text-black transition duration-200 hover:bg-white/70">About</a></li>
        <li><a href="#" class="inline-block px-4 py-2 rounded bg-white/50 text-black transition duration-200 hover:bg-white/70">Careers</a></li>
      </ul>
    </nav>
  </div>

  <div id="mobile-menu" class="hidden md:hidden px-4 pb-4 space-y-2 bg-black/70">
    <a href="#" class="block text-yellow-400 hover:text-white transition duration-200">Home</a>
    <a href="#" class="block text-yellow-400 hover:text-white transition duration-200">Clients</a>
    <a href="#" class="block text-yellow-400 hover:text-white transition duration-200">About</a>
    <a href="#" class="block text-yellow-400 hover:text-white transition duration-200">Careers</a>
  </div>
</div>

<div class="bg-black/40">
  <div class="container mx-auto px-4 pt-16 pb-16 md:pt-20 md:pb-20 text-center text-white">
    <h1 class="text-4xl md:text-5xl font-semibold">We do great things</h1>
    <h2 class="text-2xl md:text-3xl mt-4">Donec pulvinar ullamcorper metus</h2>
    <a href="#info" class="inline-block bg-blue-400 text-black py-2 px-6 my-6 rounded hover:bg-white/50 transition duration-200">Learn More</a>
  </div>
</div>

</header>

<section id="info" class="scroll-mt-20 py-16">
  <div class="container mx-auto px-4 max-w-5xl">

    <div class="text-center mb-12">
      <h2 class="text-3xl font-semibold">Our Services</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

      <div class="bg-white p-6 rounded shadow">
        <p class="text-base mb-4">Lorem ipsum dolor sit amet.</p>
        <a href="#" class="inline-block bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-400 transition duration-200">More info</a>
      </div>

      <div class="bg-white p-6 rounded shadow">
        <p class="text-base mb-4">Lorem ipsum dolor sit amet.</p>
        <a href="#" class="inline-block bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-400 transition duration-200">More info</a>
      </div>

      <div class="bg-white p-6 rounded shadow">
        <p class="text-base mb-4">Lorem ipsum dolor sit amet.</p>
        <a href="#" class="inline-block bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-400 transition duration-200">More info</a>
      </div>

    </div>
  </div>
</section>

<footer class="bg-gray-800 text-white py-8">
  <div class="container mx-auto px-4 max-w-5xl">

    <div class="flex flex-col sm:flex-row justify-between gap-6">

      <div class="sm:w-1/2">
        <form>
          <label class="text-sm">Sign up for our newsletter</label>
          <div class="mt-2 flex">
            <input class="w-full px-4 py-2 rounded-l-md text-gray-700" type="email">
            <input class="bg-blue-500 text-black px-4 py-2 rounded-r-md hover:bg-blue-400 cursor-pointer transition duration-200" type="submit" value="Submit">
          </div>
        </form>
      </div>

      <div class="md:w-1/2 text-sm md:text-right text-center mt-4 md:mt-0">
        <p>© Ryu Sutton <span id="year"></span></p>
      </div>

    </div>

  </div>
</footer>

<script>
const toggle = document.getElementById("menu-toggle");
const mobileMenu = document.getElementById("mobile-menu");

toggle.addEventListener("click", () => {
  const isHidden = mobileMenu.classList.toggle("hidden");
  toggle.setAttribute("aria-expanded", !isHidden);
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
